# One SQLite binding for the whole tree: the NocoBase packages accept 12 or 13,
# and loading two builds of the native addon in one process crashes it.
overrides:
  better-sqlite3: 13.0.3
  # The authorization core still asks for an older database package; one copy
  # keeps its connection types compatible with the rest of the tree.
  '@nocobase/db': 1.0.0-beta.7

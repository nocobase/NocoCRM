# Copy this file to config.yml before starting the application.

# Read-only showcase deployment. Use its own database and storage directory.
# Generate the existing CRM story after enabling: pnpm nocobase demo-mode data import --actor <id> --language <lang> --force,
# or POST <base path>/api/demoMode/data/import as an administrator.
# NOCOBASE_DEMO_MODE=true enables the same plugin setting.
# demoMode:
#   enabled: true
#   quickSignIn: true
#   dailyReset:
#     hour: 3
#     minute: 0
#     timezone: UTC
#     language: en-US
# Daily reset is always enabled in Demo Mode. Deployment environment overrides:
# NOCOBASE_DEMO_RESET_HOUR, NOCOBASE_DEMO_RESET_MINUTE,
# NOCOBASE_DEMO_RESET_TIMEZONE, NOCOBASE_DEMO_RESET_LANGUAGE.

# app:
#   Public origin used for callbacks and redirects in production.
#   publicOrigin: https://apps.example.com

# The language the application starts in, for the browser and the server alike. Which languages it offers follows
# from the files in client/locales and server/locales, not from configuration.
# i18n:
#   defaultLocale: zh-CN

# Limits every /api request meets before its route, each off until set. bodyLimit refuses a larger body with 413
# BODY_TOO_LARGE; a route may set its own, usually smaller, limit. timeout answers 503 REQUEST_TIMEOUT when a handler
# has not produced its response in time; a streaming response that has started is not cut off. rateLimit allows max
# requests per window from each client address and answers 429 RATE_LIMITED with Retry-After; GET /api/healthz is
# exempt. Counters live in each process, so every instance counts on its own, and behind a reverse proxy the proxy is
# the client address. API_BODY_LIMIT and API_TIMEOUT set the first two.
# api:
#   bodyLimit: 10mb
#   timeout: 30s
#   rateLimit:
#     max: 600
#     window: 1m

# Realtime defaults to inMemory when broker is omitted. An explicit broker requires adapter.
# For local-only selection: realtime: { broker: { adapter: inMemory } }.
# For multiple processes, install @nocobase/app-plugin-realtime-redis and register its
# @nocobase/app-plugin-realtime-redis/server definition in server/plugins.ts on every instance.
# Realtime events are transient; clients refetch after subscription acknowledgement.
# realtime:
#   broker:
#     adapter: redis
#     setupTimeoutMs: 5000
#     connection:
#       host: 127.0.0.1
#       port: 6379
#       commandTimeout: 5000
#   namespace: my-app # Defaults to the application name; keep applications isolated.
#   authorizationTimeoutMs: 5000
#   sessionCheckIntervalMs: 30000
#   limits:
#     maxConcurrentAuthorizations: 256
#     maxPendingAuthorizations: 2048
#     maxRecentEventIds: 10000
#     maxConnections: 10000
#     maxMessageBytes: 65536
#     maxSubscriptionsPerConnection: 64
#     maxBufferedBytesPerConnection: 1048576
#     maxPendingMessagesPerConnection: 64

# Values under client are public and embedded in the SPA HTML.
client:
  app:
    title: NocoCRM
    # Defaults apply only when no valid browser-local choice is saved.
    # defaultColorScheme: system # light | dark | system
    # defaultTheme: compact # ID from client/theme/theme-presets.ts

users:
  # The first administrator, created only when seeding an empty user table. Changing these values later does not
  # reset an existing account. Replace the password before exposing the application. INITIAL_ADMIN_USERNAME,
  # INITIAL_ADMIN_EMAIL and INITIAL_ADMIN_PASSWORD set them from the environment instead.
  initialAdmin:
    username: nocobase # 3–30 letters, digits, underscores or dots; stored lowercase
    email: admin@nocobase.com # stored lowercase; also signs in
    password: admin123

# Master keys for what the application encrypts at rest — stored credentials and API keys, OAuth tokens — and from
# which the sign-in and session keys are derived. The first key is current; the others only decrypt. To rotate, put a
# new key first with a higher version, run `pnpm nocobase secrets rotate`, then remove the old key. Changing the current
# key signs everyone out. Generate a key with: openssl rand -hex 32. SECRETS_KEYS=2:<key>,1:<key> sets the list from
# the environment instead.
secrets:
  keys:
    - version: 1
      key: replace-with-a-unique-secret

# Optional shared sender for Auth, Users invitations and email notification channels. This example is commented out;
# server/config/mailers.ts defaults to an empty configuration, so example values do not enable mail delivery.
# `system` is only this template's sample name. Values are literal: ${NAME} is not expanded. The mapping explicitly
# declares MAILERS_SYSTEM_* variables; inject the password through MAILERS_SYSTEM_PASSWORD.
# The CRM's existing senders (auth.email and the system-email channel below) keep working without it.
# mailers:
#   default: system
#   system:
#     provider: smtp
#     host: smtp.example.com
#     port: 587
#     secure: false
#     auth:
#       user: notifications@example.com
#     from: App <notifications@example.com>

# For Resend, use a separate entry with provider: resend, apiKey and from; do not mix provider fields:
# mailers:
#   default: system
#   system:
#     provider: resend
#     apiKey: replace-with-the-api-key
#     from: "Studio <notifications@example.com>"
#
# Equivalent SMTP .env example (use the Resend alternative below instead of its provider-specific SMTP fields):
# MAILERS_DEFAULT=system
# MAILERS_SYSTEM_PROVIDER=smtp
# MAILERS_SYSTEM_HOST=smtp.example.com
# MAILERS_SYSTEM_PORT=587
# MAILERS_SYSTEM_SECURE=false
# MAILERS_SYSTEM_USER=notifications@example.com
# MAILERS_SYSTEM_PASSWORD=replace-with-the-password
# MAILERS_SYSTEM_FROM=Studio <notifications@example.com>
# MAILERS_SYSTEM_REPLY_TO=support@example.com
# MAILERS_SYSTEM_ENABLED=true
#
# Resend .env alternative:
# MAILERS_DEFAULT=system
# MAILERS_SYSTEM_PROVIDER=resend
# MAILERS_SYSTEM_API_KEY=replace-with-the-api-key
# MAILERS_SYSTEM_FROM=Studio <notifications@example.com>
# MAILERS_SYSTEM_REPLY_TO=support@example.com
# MAILERS_SYSTEM_ENABLED=true

auth:
  # Authentication owns this sender; notification and mailbox configuration are independent.
  # Set app.publicOrigin (or APP_PUBLIC_ORIGIN) before enabling automatic recovery.
  # The CRM turns passwordReset on (server/config/auth.ts): configuring this sender is what makes the login page offer
  # "Forgot password" (for Gmail, an app password, with host smtp.gmail.com, port 465, secure: true).
  # A named sender from mailers above can take its place:
  # passwordReset:
  #   mailer: system # omit to preserve existing default selection
  # The inline auth.email below and AUTH_EMAIL_* remain supported for compatibility.
  # email:
  #   provider: smtp
  #   host: smtp.example.com
  #   port: 587
  #   secure: false
  #   auth:
  #     user: noreply@example.com
  #     pass: replace-with-the-smtp-password
  #   from: App <noreply@example.com>
  #   replyTo: support@example.com
  # For Resend, replace the entire email block with these fields; do not mix SMTP fields:
  # email:
  #   provider: resend
  #   apiKey: replace-with-the-resend-api-key
  #   from: App <noreply@example.com>
  # AUTH_EMAIL_PROVIDER/HOST/PORT/SECURE/USER/PASSWORD/FROM/REPLY_TO/API_KEY override auth.email.
  # The template signs new accounts in (autoSignIn: true, since 1.0.0-beta.92); the CRM has no sign-up
  # (disableSignUp in server/config/auth.ts), so the setting has nothing to act on and stays false.
  emailAndPassword:
    enabled: true
    autoSignIn: false
  session:
    storeSessionInDatabase: true

notification:
  # provider remains a compatibility alias for type; both must match when supplied.
  channels:
    inbox:
      type: in-app

    # Uncomment and configure independent email Channels. `system-email` sends the invitations of Settings → Users
    # (the password reset mail has its own sender, auth.email above); its password may come from SMTP_PASSWORD
    # instead (for Gmail, an app password, with host smtp.gmail.com, port 465, secure: true).
    # Values are read as written: ${NAME} is not expanded. To take a secret from the environment instead, map a
    # variable onto its path in env of server/config/notification.ts, such as SMTP_PASSWORD.
    # Configuring mailers alone does not create a notification channel. A channel can send through a named mailer:
    # system-email:
    #   type: email
    #   mailer: system # omit to use mailers.default
    # Legacy type: smtp/resend inline channels and SMTP_PASSWORD/RESEND_API_KEY remain supported:
    # system-email:
    #   type: smtp
    #   host: smtp.example.com
    #   port: 587
    #   auth:
    #     user: notifications@example.com
    #     pass: replace-with-the-smtp-password
    #   from: notifications@example.com
    # marketing-email:
    #   type: resend
    #   apiKey: replace-with-the-resend-api-key
    #   from: marketing@example.com

    # ops-feishu:
    #   type: feishu-webhook
    #   webhookUrl: https://open.feishu.cn/open-apis/bot/v2/hook/replace-with-the-token
    # ops-dingtalk:
    #   type: dingtalk-webhook
    #   webhookUrl: https://oapi.dingtalk.com/robot/send?access_token=replace-with-the-token

# Mail servers users connect their own mailboxes through, on the CRM's Mail accounts page. They are separate from the
# notification channels above. Each key is a stable name its connected accounts keep: renaming one disconnects them.
# For an IMAP/SMTP server each user enters their address and password (often an app password or an authorization
# code) when connecting; Gmail and Microsoft 365 connect through OAuth, whose callback is
# <origin><base path>/mail/oauth/callback, to be registered with Google or Microsoft. Restart after editing.
# mail:
#   providers:
#     company-mail:
#       type: imap-smtp
#       imap:
#         host: imap.example.com
#         port: 993
#         secure: true
#       smtp:
#         host: smtp.example.com
#         port: 465
#         secure: true
#     gmail-imap:
#       type: imap-smtp
#       imap:
#         host: imap.gmail.com
#         port: 993
#         secure: true
#       smtp:
#         host: smtp.gmail.com
#         port: 465
#         secure: true
#     google:
#       type: gmail
#       clientId: replace-with-google-oauth-client-id
#       clientSecret: replace-with-google-oauth-client-secret
#     microsoft-365:
#       type: microsoft
#       clientId: replace-with-microsoft-entra-client-id
#       clientSecret: replace-with-microsoft-entra-client-secret

# Model services for the CRM's AI, keyed by service name. At start, one not yet on the Agents plugin's Models page
# is created there (an administrator's edits on that page stand). Restart the server after editing, which `pnpm dev`
# does on its own.
# Keep the key out of this file. Write it into config.yml with
# `pnpm nocobase config set --from-env ai.llmServices.openai.options.apiKey=OPENAI_API_KEY`,
# or map an injected environment variable onto that path in server/config/ai.ts.
# ai:
#   llmServices:
#     openai:
#       title: OpenAI
#       provider: openai
#       enabledModels:
#         - label: GPT-4.1
#           value: gpt-4.1
#       enabled: true
#       sort: 10

# DB_DIALECT, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_SSL and DB_FILENAME override the main
# connection's fields from the environment.
database:
  default: main
  connections:
    main:
      dialect: sqlite
      database: crm.sqlite
      debug: false
      # For Oracle, use dialect: oracle and replace database with serviceName: FREEPDB1.
      # For SQL Server, use dialect: mssql and configure encrypt and trustServerCertificate.
      schemaManagement: managed
      migrations:
        autoRun: true
      seeds:
        autoRun: true
    # Additional managed databases use database/<connectionName>/{migrations,seeds}.
    # analytics:
    #   dialect: postgres
    #   host: localhost
    #   database: analytics
    #   username: postgres
    #   password: replace-with-the-password # or DB_ANALYTICS_PASSWORD, declared with connectionEnvironment('analytics', 'DB_ANALYTICS')
    #   schemaManagement: managed
    #   migrations:
    #     autoRun: false
    #   seeds:
    #     autoRun: false
    # An existing database another system owns sets schemaManagement: external and runs no tasks. Its titles,
    # descriptions and relations are read from database/<connection>/metadata/<name>.json unless metadataStore says otherwise.

snowflake:
  # Assign a unique worker ID to each concurrently running instance.
  workerId: 0
  epoch: 1605024000

# Scheduled jobs, such as the Scheduler plugin's. Without jobs.default they run on the built-in memory adapter:
# state kept in the process, read from storage/jobs at startup and written back when the application stops, so a
# process that is killed loses what changed since it started. It serves one process: every other process or instance
# would run its own copy. Set default to memory to keep that without the startup warning, or to redis to run several.
# Redis must persist its data (AOF or RDB) and use maxmemory-policy noeviction, or schedules can be lost.
# Install the commercial @nocobase/app-plugin-jobs-redis package and register its Server plugin
# from @nocobase/app-plugin-jobs-redis/server in server/plugins.ts on every producer and consumer.
# Upgrading deployments must set adapter: redis explicitly; the application no longer supplies Redis defaults.
# jobs:
#   default: redis
#   backends:
#     redis:
#       adapter: redis
#       connection:
#         host: 127.0.0.1
#         port: 6379
#       # namespace: my-app # defaults to the application name; set it when deployments share one Redis

# The CRM's AI follow-ups of leads and deals run on their own jobs configuration, crmFollowUps (memory, four at
# a time, defined in server/config/jobs.ts). Raise concurrency, or, with the Jobs Redis plugin above registered, move
# them to Redis to run across instances:
# jobs:
#   backends:
#     crmFollowUps:
#       concurrency: 6
#       # adapter: redis
#       # connection: { host: 127.0.0.1, port: 6379 }

# The jobs configuration the Scheduler plugin's schedules run on, by name. Left out, they follow jobs.default.
# scheduler:
#   jobs: redis

# File logging is independent of terminal formatting.
logging:
  level: info
  file:
    enabled: true
    retentionDays: 7
    name: app
    maxFileSizeMB: 10
    maxTotalSizeMB: 500
  loggers:
    request:
      file:
        name: request
  console:
    enabled: true
    # Set true for human-readable terminal output.
    pretty: false
